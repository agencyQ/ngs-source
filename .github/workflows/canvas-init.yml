name: Canvas Init

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  canvas-init:
    runs-on: ubuntu-latest

    steps:
      - name: Derive secret prefix from branch
        id: prefix
        run: |
          PREFIX=$(echo "${{ github.ref_name }}" | tr '[:lower:]' '[:upper:]')
          echo "value=${PREFIX}__" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Scaffold Canvas skills
        run: |
          git config --global user.name "Source CMS"
          git config --global user.email "no-reply.source-cms@acquia.com"
          cd $GITHUB_WORKSPACE/..
          npx @drupal-canvas/create@latest canvas-scaffold --template acquia-nebula --agents none
          rm -rf canvas-scaffold/.git canvas-scaffold/.github
          cp -a canvas-scaffold/. $GITHUB_WORKSPACE/
          rm -rf canvas-scaffold

      - name: Create Canvas config
        run:
          node -e "fs.writeFileSync('canvas.config.json',
          JSON.stringify({componentDir:'./src/components',pagesDir:'./pages',aliasBaseDir:'src',globalCssPath:'./src/global.css'},
          null, 2) + '\n')"

      - name: Exclude Source CMS-owned files from linters
        run: |
          if [ -f .prettierignore ]; then
            if ! grep -qx '.github' .prettierignore; then
              echo '.github' >> .prettierignore
            fi
          fi

      - name: Pull components from Source CMS
        run: npx @drupal-canvas/cli@0.11.2 pull --yes
        env:
          CANVAS_SITE_URL:
            ${{ secrets[format('{0}CANVAS_SITE_URL',
            steps.prefix.outputs.value)] }}
          CANVAS_CLIENT_ID:
            ${{ secrets[format('{0}CANVAS_CLIENT_ID',
            steps.prefix.outputs.value)] }}
          CANVAS_CLIENT_SECRET:
            ${{ secrets[format('{0}CANVAS_CLIENT_SECRET',
            steps.prefix.outputs.value)] }}

      - name: Commit and push
        run: |
          set -euo pipefail
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          git -c user.name="Source CMS" \
              -c user.email="no-reply.source-cms@acquia.com" \
              commit -m "Initialize Canvas components and skills"
          git push
